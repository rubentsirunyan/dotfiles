after-login-command = []
after-startup-command = [
  'exec-and-forget borders active_color=0xfffcba03 inactive_color=0xff494d64 width=5.0',
  'exec-and-forget open -b com.mitchellh.ghostty',
  'exec-and-forget open -na "Google Chrome" --args --profile-directory="Default"',
  'exec-and-forget open -na "Google Chrome" --args --profile-directory="Profile 1"',
  'exec-and-forget open -b com.apple.mail',
  'exec-and-forget open -b com.apple.iCal',
  'exec-and-forget open -b org.whispersystems.signal-desktop',
  'exec-and-forget open -b im.riot.app',
  'exec-and-forget open -b com.spotify.client',
  'exec-and-forget open -b md.obsidian',
  'exec-and-forget open -b com.TickTick.task.mac',
  'exec-and-forget open -b com.anthropic.claudefordesktop',
  # Chrome/Obsidian set window titles late, so the title-based rules below can
  # lose the race at login; this re-sorts them once titles are final.
  'exec-and-forget ~/.config/aerospace/sort-windows.sh --watch 90',
]

start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
# enable-normalization-flatten-containers = true
# enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = true

non-empty-workspaces-root-containers-layout-on-startup = 'smart'

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 5
    inner.vertical =   5
    outer.left =       5
    outer.bottom =     5
    outer.top =        5
    outer.right =      5

[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    # "Super" prefix = ctrl-alt-cmd, produced by holding Tab (Karabiner remap).
    # Keeps plain alt free for typing numbers/special chars on the Armenian layout.
    ctrl-alt-cmd-t = 'layout tiles horizontal vertical'
    ctrl-alt-cmd-s = 'layout accordion horizontal vertical'

    ctrl-alt-cmd-h = 'focus left'
    ctrl-alt-cmd-j = 'focus down'
    ctrl-alt-cmd-k = 'focus up'
    ctrl-alt-cmd-l = 'focus right'

    ctrl-alt-cmd-shift-h = 'move left'
    ctrl-alt-cmd-shift-j = 'move down'
    ctrl-alt-cmd-shift-k = 'move up'
    ctrl-alt-cmd-shift-l = 'move right'

    ctrl-alt-cmd-z = 'fullscreen'

    ctrl-alt-cmd-minus = 'resize smart -50'
    ctrl-alt-cmd-equal = 'resize smart +50'

    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'
    ctrl-alt-cmd-7 = 'workspace 7'
    ctrl-alt-cmd-8 = 'workspace 8'
    ctrl-alt-cmd-9 = 'workspace 9'
    ctrl-alt-cmd-0 = 'workspace 10'
    ctrl-alt-cmd-m = 'workspace M'
    ctrl-alt-cmd-c = 'workspace C'
    ctrl-alt-cmd-e = 'workspace E'

    ctrl-alt-cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    ctrl-alt-cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    ctrl-alt-cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    ctrl-alt-cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    ctrl-alt-cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    ctrl-alt-cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    ctrl-alt-cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    ctrl-alt-cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    ctrl-alt-cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
    ctrl-alt-cmd-shift-0 = 'move-node-to-workspace --focus-follows-window 10'
    ctrl-alt-cmd-shift-m = 'move-node-to-workspace --focus-follows-window M'
    ctrl-alt-cmd-shift-c = 'move-node-to-workspace --focus-follows-window C'
    ctrl-alt-cmd-shift-e = 'move-node-to-workspace --focus-follows-window e'

    # Tab can't chord with itself while held as super, so these stay on
    # the physical alt key.
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-node-to-monitor --wrap-around --focus-follows-window next'
    # reachable via space+tab / space+shift+tab (space super layer in Karabiner)
    ctrl-alt-cmd-tab = 'workspace-back-and-forth'
    ctrl-alt-cmd-shift-tab = 'move-node-to-monitor --wrap-around --focus-follows-window next'

    # modes
    ctrl-alt-cmd-shift-semicolon = 'mode service'
    ctrl-alt-cmd-r = 'mode resize'
    ctrl-alt-cmd-shift-backslash = 'mode join'
    ctrl-alt-cmd-d = 'mode display'

[mode.service.binding]
    shift-r = [
      'reload-config', 
      '''exec-and-forget
          terminal-notifier 
            -title "AeroSpace"
            -message "Config reloaded"
            -group aerospace.reload-config
            -remove aerospace.reload-config
            -ignoreDnD
      ''', 
      'mode main'
    ]
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    s = ['exec-and-forget ~/.config/aerospace/sort-windows.sh', 'mode main'] # Sort Chrome/Obsidian windows onto their workspaces
    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    esc = ['mode main']

[mode.join.binding]
    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']

[mode.display.binding]
    h = ['focus-monitor left', 'mode main']
    j = ['focus-monitor down', 'mode main']
    k = ['focus-monitor up', 'mode main']
    l = ['focus-monitor right', 'mode main']
    ctrl-alt-cmd-h = ['move-node-to-monitor --wrap-around --focus-follows-window left', 'mode main']
    ctrl-alt-cmd-j = ['move-node-to-monitor --wrap-around --focus-follows-window down', 'mode main']
    ctrl-alt-cmd-k = ['move-node-to-monitor --wrap-around --focus-follows-window up', 'mode main']
    ctrl-alt-cmd-l = ['move-node-to-monitor --wrap-around --focus-follows-window right', 'mode main']
    esc = ['mode main']

[workspace-to-monitor-force-assignment]
M = 'secondary'
'10' = 'secondary'

[[on-window-detected]]
if.workspace = '5'
run = ['layout accordion horizontal']
check-further-callbacks = true

[[on-window-detected]]
if.workspace = '8'
run = ['layout accordion horizontal']
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = '.*Google Chrome - .* .Work.$'
run = 'move-node-to-workspace 2'
check-further-callbacks = false

[[on-window-detected]]
if.app-id = "com.google.Chrome"
# if.window-title-regex-substring = '.* - Google Chrome - .* .Personal.$'
run = "move-node-to-workspace 3"
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace E'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace C'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 8'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'im.riot.app'
run = 'move-node-to-workspace 8'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace M'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'move-node-to-workspace 6'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'org.keepassxc.keepassxc'
run = 'move-node-to-workspace 6'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.utmapp.UTM'
run = 'move-node-to-workspace 6'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace 5'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 5'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'md.obsidian'
if.window-title-regex-substring = '.* - work - Obsidian .*'
run = 'move-node-to-workspace 4'
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'md.obsidian'
if.window-title-regex-substring = '.* - Main - Obsidian .*'
run = 'move-node-to-workspace 7'
check-further-callbacks = false

# Fallback for Obsidian windows whose title isn't set yet at detection time:
# default to 7; sort-windows.sh moves work-vault windows to 4 once the title
# is final.
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 7'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = 'move-node-to-workspace 7'
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace 9'
check-further-callbacks = true

[[on-window-detected]]
